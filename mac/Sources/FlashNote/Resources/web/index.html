<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#52C41A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="闪记" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/images/icon-512.png" />
  <link rel="apple-touch-icon" href="/images/icon-512.png" />
  <title>闪记</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部 -->
    <header class="topbar">
      <h1 class="title">闪记</h1>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="list" id="tabList">记录</button>
        <button class="tab" data-tab="stats" id="tabStats">统计</button>
      </div>
      <div class="sync-pill" id="syncPill" title="点击立即同步">
        <span class="dot"></span>
        <span class="text" id="syncText">本地</span>
      </div>
    </header>

    <!-- 卡片流 -->
    <main class="main" id="main">
      <div class="empty" id="empty">
        <div class="emoji">📝</div>
        <div>还没有记录</div>
        <div class="hint">试试在底部输入 <code>午饭 28 #餐</code></div>
      </div>
      <div class="list" id="list"></div>
    </main>

    <!-- 统计页 -->
    <main class="main stats-main" id="statsMain" hidden>
      <div id="statsContent"></div>
    </main>

    <!-- 底部输入条 -->
    <footer class="quick-input">
      <div class="preview" id="preview" hidden>
        <span class="preview-amount" id="previewAmount"></span>
        <span class="preview-tags" id="previewTags"></span>
        <span class="preview-type" id="previewType"></span>
      </div>
      <div class="input-row">
        <input
          class="input"
          id="input"
          type="text"
          placeholder="记一笔… 支持 #标签  ¥金额"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="send"
        />
        <button class="send" id="sendBtn" aria-label="记录">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- 配对浮层（未配对时显示） -->
  <div class="pair-mask" id="pairMask" hidden>
    <div class="pair-card">
      <div class="pair-emoji">🔗</div>
      <h2 class="pair-title">连接 Mac</h2>
      <p class="pair-tip">在 Mac 端「闪记」窗口顶栏点配对码，<br>把 4 位数字输到下面：</p>
      <input
        class="pair-input"
        id="pairInput"
        type="text"
        inputmode="numeric"
        pattern="\d{4}"
        maxlength="4"
        placeholder="____"
        autocomplete="off"
      />
      <div class="pair-error" id="pairError" hidden></div>
      <button class="pair-btn" id="pairBtn">连接</button>
      <button class="pair-skip" id="pairSkip">跳过 · 离线用</button>
    </div>
  </div>

  <!-- 编辑浮层 -->
  <div class="edit-mask" id="editMask" hidden>
    <div class="edit-card">
      <div class="edit-header">
        <span class="edit-title">编辑记录</span>
        <button class="edit-close" id="editClose" aria-label="关闭">×</button>
      </div>
      <textarea
        class="edit-textarea"
        id="editText"
        placeholder="午饭 28 #餐 · 想法 #产品"
        rows="3"
      ></textarea>
      <div class="edit-preview" id="editPreview" hidden>
        <span class="preview-amount" id="editAmount"></span>
        <span class="preview-tags" id="editTags"></span>
        <span class="preview-type" id="editType"></span>
      </div>
      <div class="edit-actions">
        <button class="edit-del" id="editDel">删除</button>
        <div class="edit-spacer"></div>
        <button class="edit-cancel" id="editCancel">取消</button>
        <button class="edit-save" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
  <script>
    // 注册 service worker（PWA 离线）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
